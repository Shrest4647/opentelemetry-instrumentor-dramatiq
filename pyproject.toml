
[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelemetry-instrumentor-dramatiq"
version = "0.1.1"
description = "An instrumentor for dramatiq library"
readme = "README.md"
authors = [{ name = "Sunil", email = "shrest4647+pip@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
keywords = ["dramatiq", "opentelemetry", "instrumentation", "tracing", "telemetry"]
dependencies = [
    "dramatiq>=1.2,<2.0",
    "opentelemetry-api>=1.11.0,<2.0",
    "opentelemetry-instrumentation>=0.31,<1.0",
    "opentelemetry-semantic-conventions>=0.40,<1.0",
]
requires-python = ">=3.7"

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pip-tools>=6.0,<8.0",
    "bumpver>=2023.0,<2026.0",
    "pika>=0.13,<2.0",
    "redis>=4.0,<6.0",
]

[project.urls]
Homepage = "https://github.com/Shrest4647/opentelemetry-instrumentor-dramatiq"