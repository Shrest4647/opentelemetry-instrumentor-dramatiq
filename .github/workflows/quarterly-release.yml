name: Quarterly Release (Minor Bump)
on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every quarter (Jan 1, Apr 1, Jul 1, Oct 1)
    - cron: "0 0 1 1,4,7,10 *"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  quarterly-release:
    name: Bump Minor Version & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Bump minor version
        id: version
        run: |
          OLD_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          MAJOR=$(echo $OLD_VERSION | cut -d. -f1)
          MINOR=$(echo $OLD_VERSION | cut -d. -f2)
          PATCH=$(echo $OLD_VERSION | cut -d. -f3)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          
          # Update pyproject.toml
          sed -i "s/version = \"$OLD_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml
          
          # Update src/version.py
          sed -i "s/__version__ = \"$OLD_VERSION\"/__version__ = \"$NEW_VERSION\"/" opentelemetry_instrumentor_dramatiq/src/version.py
          
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add pyproject.toml opentelemetry_instrumentor_dramatiq/src/version.py
          git commit -m "chore: bump version ${{ steps.version.outputs.old_version }} -> ${{ steps.version.outputs.new_version }}"

      - name: Create Git tag
        run: |
          git tag -a v${{ steps.version.outputs.new_version }} -m "chore: quarterly release v${{ steps.version.outputs.new_version }}"

      - name: Push changes and tag
        run: |
          git push origin main
          git push origin v${{ steps.version.outputs.new_version }}

      - name: Check workflow status
        run: |
          echo "✅ Version bumped to v${{ steps.version.outputs.new_version }}"
          echo "📦 Publish workflow will be triggered automatically"
